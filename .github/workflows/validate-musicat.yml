name: Validate public Musicat history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-musicat.yml"
      - "scripts/check-musicat.mjs"
      - "src/musicat-reader.mjs"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      profile_url:
        description: Public Musicat profile URL
        required: true
        default: https://musicat.fm/lightjjk
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate public profile and history
        env:
          MUSICAT_PROFILE_URL: \${{ inputs.profile_url || 'https://musicat.fm/lightjjk' }}
        run: npm run check
