name: Validate public Musicat history

on:
  workflow_dispatch:
    inputs:
      profile_url: https://musicat.fm/lightjjk
        description: Public Musicat profile URL (https://musicat.fm/lightjjk)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate public profile and history
        env:
          MUSICAT_PROFILE_URL: ${{ inputs.profile_url }}
        run: npm run check
