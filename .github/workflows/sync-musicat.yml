name: Sync approved Musicat profiles

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: global-streamverse-musicat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Check approval and sync scripts
        run: |
          node --check scripts/approve-musicat-participants.mjs
          node --check scripts/sync-musicat.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify protected secret exists
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::The protected SUPABASE_SECRET_KEY repository secret has not been configured."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) echo "Supabase secret key format detected." ;;
            *) echo "::error::SUPABASE_SECRET_KEY must contain the Supabase secret API key (sb_secret_...), not the publishable key."; exit 1 ;;
          esac
      - name: Automatically validate and approve pending Musicat profiles
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_PENDING_PER_RUN: "25"
        run: node scripts/approve-musicat-participants.mjs
      - name: Sync approved Musicat profiles
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_PARTICIPANTS_PER_RUN: "20"
        run: npm run sync
