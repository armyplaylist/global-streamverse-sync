name: Sync approved Musicat profiles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-streamverse-musicat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify protected secret exists
        env:
          SUPABASE_SECRET_KEY: \${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::The protected SUPABASE_SECRET_KEY repository secret has not been configured."
            exit 1
          fi
      - name: Sync approved Musicat profiles
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: \${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run sync
