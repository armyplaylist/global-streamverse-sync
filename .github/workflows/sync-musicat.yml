name: Sync approved Musicat profiles

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: global-streamverse-musicat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run unit tests
        run: npm test
      - name: Check approval and sync scripts
        run: |
          node --check scripts/supabase-api.mjs
          node --check scripts/approve-musicat-participants.mjs
          node --check scripts/sync-musicat.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify protected secret exists
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::The protected SUPABASE_SECRET_KEY repository secret has not been configured."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { detectSupabaseCredentialType } from "./scripts/supabase-api.mjs";
          const type = detectSupabaseCredentialType(process.env.SUPABASE_SECRET_KEY);
          console.log(type === "new-secret"
            ? "Modern Supabase secret key detected."
            : "Legacy Supabase service_role key detected.");
          NODE
      - name: Automatically validate and approve pending Musicat profiles
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_PENDING_PER_RUN: "25"
        run: node scripts/approve-musicat-participants.mjs
      - name: Sync approved Musicat profiles
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_PARTICIPANTS_PER_RUN: "20"
          MUSICAT_SYNC_OVERLAP_MS: "7200000"
        run: npm run sync
      - name: Sync linked Spotify listening histories
        env:
          SUPABASE_URL: https://ylybwiwemlnekclrwwjq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: curl --fail-with-body --silent --show-error --max-time 180 -X POST "$SUPABASE_URL/functions/v1/spotify-sync" -H "apikey: $SUPABASE_SECRET_KEY" -H "Content-Type: application/json" -d "{}"
